name: build
on: [ push ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        
      - name: Install Packages
        run: sudo apt-get install -y advancecomp
        
        # cache local gradle files, global ones will be taken care of by the setup-gradle action
      - uses: actions/cache@v4
        with:
          path: |
            **/.gradle/
            **/build/
          key: ${{ runner.os }}-gradlelocal-${{ github.ref }}
        
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}
          
      - name: Build
        run: ./gradlew :20.1-lexforge:build :21.1-neoforge:build distributionArtifacts --stacktrace --no-daemon
        
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: toomanyrecipeviewers
          path: |
            versions/*/build/libs/TMRVReforged-*.jar
            versions/*/build/libs/TMRVReforged-*-source.zip
          if-no-files-found: error
